replicaCount: 1

image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""


podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: bank.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
  - name: gateway
    sectionName: http
  hostnames:
  - chart-example.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers

resources: {}

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []

volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}

global:
  environment: "kubernetes"
  security:
    allowInsecureImages: true
  kafkaConfig:
    bootstrapServers: "my-bank-app-kafka:9092"
    notificationsTopic: "notifications.events"
    notificationsGroup: "notifications-service"
  zipkinConfig:
    endpoint: "http://my-bank-app-zipkin:9411/api/v2/spans"
  prometheusConfig:
    endpoint: "http://my-bank-app-prometheus:9090"
  grafanaConfig:
    endpoint: "http://my-bank-app-grafana:3000"
  elkConfig:
    elasticsearchEndpoint: "http://my-bank-app-elasticsearch:9200"
    logstashEndpoint: "my-bank-app-logstash:5044"
    kibanaEndpoint: "http://my-bank-app-kibana:5601"

kafka:
  image:
    registry: docker.io
    repository: bitnamilegacy/kafka
    tag: 4.0.0-debian-12-r10
  persistence:
    enabled: true
    size: 8Gi
  listeners:
    client:
      protocol: PLAINTEXT
    controller:
      protocol: PLAINTEXT
    interbroker:
      protocol: PLAINTEXT
  sasl:
    enabled: false
  extraEnvVars:
    - name: KAFKA_PORT
      value: "9092"
  livenessProbe:
    tcpSocket:
      port: 9092
    initialDelaySeconds: 60
    timeoutSeconds: 10
    periodSeconds: 30
    failureThreshold: 3
  readinessProbe:
    tcpSocket:
      port: 9092
    initialDelaySeconds: 30
    timeoutSeconds: 10
    periodSeconds: 30
    failureThreshold: 3
