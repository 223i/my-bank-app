apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-frontend-test"
  labels:
    app: "{{ .Release.Name }}-frontend-test"
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "7"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
spec:
  restartPolicy: Never
  containers:
    - name: test-frontend
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Testing frontend service health..."
          # Wait for frontend to be ready with increased attempts and timeouts
          for i in $(seq 1 60); do
            echo "Attempt $i: Checking frontend availability..."
            if wget -q --timeout=10 --tries=1 --spider http://my-bank-front-app:8083; then
              echo "✅ Frontend is healthy!"
              # Wait a bit more for OAuth2 to be ready
              echo "Waiting for OAuth2 endpoint..."
              sleep 30
              # Test OAuth2 redirect with increased timeout
              if wget -q --timeout=10 --tries=1 --spider http://my-bank-front-app:8083/oauth2/authorization/keycloak; then
                echo "✅ OAuth2 endpoint is available!"
                exit 0
              else
                echo "⚠️  Frontend is up but OAuth2 endpoint not available, continuing..."
                # Don't fail immediately, give OAuth2 more time
                if [ $i -gt 50 ]; then
                  echo "❌ OAuth2 endpoint still not available after many attempts"
                  exit 1
                fi
              fi
            else
              echo "Frontend not ready yet (attempt $i/60)"
            fi
            sleep 10
          done
          echo "❌ Frontend health check failed after 60 attempts"
          exit 1
