apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SERVER_PORT
              value: {{ .Values.env.server_port | quote }}
            - name: SPRING_CLOUD_CONSUL_ENABLED
              value: "false"
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes"
            - name: SPRING_APPLICATION_NAME
              value: "gateway-service"
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: "file:/config/"
            - name: ZIPKIN_ENDPOINT
              value: {{ .Values.global.zipkinConfig.endpoint | quote }}
            - name: LOGSTASH_DESTINATION
              value: {{ .Values.global.elkConfig.logstashEndpoint | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.global.environment | quote }}
          volumeMounts:
            - name: gateway-config
              mountPath: /config
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: gateway-config
          configMap:
            name: gateway-service-config
