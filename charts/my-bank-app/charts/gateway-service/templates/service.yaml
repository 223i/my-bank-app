apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/actuator/prometheus"
    prometheus.io/port: "8080"
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: gateway-service
