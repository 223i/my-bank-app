apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grafana.fullname" . }}-dashboards-json
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
data:
  # HTTP Metrics Dashboard
  http-metrics-dashboard.json: |
    {
      "dashboard": {
        "id": null,
        "title": "My Bank App - HTTP Metrics",
        "tags": ["my-bank-app", "http"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "Request Rate",
            "type": "stat",
            "targets": [
              {
                "expr": "sum(rate(http_server_requests_seconds_count[5m])) by (service)",
                "legendFormat": "{{service}}"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "reqps"
              }
            }
          },
          {
            "id": 2,
            "title": "Error Rate (5xx)",
            "type": "stat",
            "targets": [
              {
                "expr": "sum(rate(http_server_requests_seconds_count{status=~\"5..\"}[5m])) by (service) / sum(rate(http_server_requests_seconds_count[5m])) by (service)",
                "legendFormat": "{{service}}"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "percentunit"
              }
            }
          },
          {
            "id": 3,
            "title": "Response Time Percentiles",
            "type": "graph",
            "targets": [
              {
                "expr": "histogram_quantile(0.50, sum(rate(http_server_requests_seconds_bucket[5m])) by (le, service))",
                "legendFormat": "50th percentile - {{service}}"
              },
              {
                "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le, service))",
                "legendFormat": "95th percentile - {{service}}"
              },
              {
                "expr": "histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket[5m])) by (le, service))",
                "legendFormat": "99th percentile - {{service}}"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "s"
              }
            }
          }
        ],
        "time": {
          "from": "now-1h",
          "to": "now"
        },
        "refresh": "5s"
      }
    }

  # JVM Metrics Dashboard
  jvm-metrics-dashboard.json: |
    {
      "dashboard": {
        "id": null,
        "title": "My Bank App - JVM Metrics",
        "tags": ["my-bank-app", "jvm"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "Heap Memory Usage",
            "type": "graph",
            "targets": [
              {
                "expr": "jvm_memory_used_bytes{area=\"heap\"} / jvm_memory_max_bytes{area=\"heap\"}",
                "legendFormat": "{{service}}"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "percentunit",
                "max": 1,
                "min": 0
              }
            }
          },
          {
            "id": 2,
            "title": "Non-Heap Memory Usage",
            "type": "graph",
            "targets": [
              {
                "expr": "jvm_memory_used_bytes{area=\"nonheap\"} / jvm_memory_max_bytes{area=\"nonheap\"}",
                "legendFormat": "{{service}}"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "percentunit",
                "max": 1,
                "min": 0
              }
            }
          },
          {
            "id": 3,
            "title": "CPU Usage",
            "type": "graph",
            "targets": [
              {
                "expr": "process_cpu_seconds_total * 100",
                "legendFormat": "{{service}}"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "percent"
              }
            }
          },
          {
            "id": 4,
            "title": "GC Pause Time",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(jvm_gc_pause_seconds_sum[5m])",
                "legendFormat": "GC Pause Rate - {{service}}"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "s"
              }
            }
          }
        ],
        "time": {
          "from": "now-1h",
          "to": "now"
        },
        "refresh": "5s"
      }
    }

  # Business Metrics Dashboard
  business-metrics-dashboard.json: |
    {
      "dashboard": {
        "id": null,
        "title": "My Bank App - Business Metrics",
        "tags": ["my-bank-app", "business"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "Failed Transfers Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(failed_transfers_total[5m])",
                "legendFormat": "Failed Transfers/sec"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "reqps"
              }
            }
          },
          {
            "id": 2,
            "title": "Failed Cash Operations Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(failed_cash_operations_total[5m])",
                "legendFormat": "Failed Cash Ops/sec"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "reqps"
              }
            }
          },
          {
            "id": 3,
            "title": "Notification Failures Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(notification_failures_total[5m])",
                "legendFormat": "Notification Failures/sec"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "reqps"
              }
            }
          },
          {
            "id": 4,
            "title": "Failed Operations by User",
            "type": "table",
            "targets": [
              {
                "expr": "sum by (login) (increase(failed_transfers_total[1h]))",
                "legendFormat": "{{login}}",
                "format": "table"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "short"
              }
            }
          }
        ],
        "time": {
          "from": "now-1h",
          "to": "now"
        },
        "refresh": "5s"
      }
    }
