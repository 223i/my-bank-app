apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grafana.fullname" . }}-dashboards-json
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
data:
  http-metrics-dashboard.json: |
    {
      "id": null,
      "title": "My Bank App - HTTP Metrics",
      "tags": ["my-bank-app", "http"],
      "timezone": "browser",
      "panels": [
        {
          "id": 1,
          "title": "Request Rate",
          "type": "stat",
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count[5m])) by (service)",
              "legendFormat": "service"
            }
          ]
        },
        {
          "id": 2,
          "title": "4xx Rate",
          "type": "stat",
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{status=~\"4..\"}[5m])) by (service) / sum(rate(http_server_requests_seconds_count[5m])) by (service)",
              "legendFormat": "service"
            }
          ]
        },
        {
          "id": 3,
          "title": "5xx Rate",
          "type": "stat",
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{status=~\"5..\"}[5m])) by (service) / sum(rate(http_server_requests_seconds_count[5m])) by (service)",
              "legendFormat": "service"
            }
          ]
        },
        {
          "id": 4,
          "title": "Response Time Percentiles",
          "type": "timeseries",
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(http_server_requests_seconds_bucket[5m])) by (le, service))",
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le, service))",
              "legendFormat": "p95"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket[5m])) by (le, service))",
              "legendFormat": "p99"
            }
          ]
        }
      ],
      "refresh": "10s"
    }

  jvm-metrics-dashboard.json: |
    {
      "id": null,
      "title": "My Bank App - JVM Metrics",
      "tags": ["my-bank-app", "jvm"],
      "timezone": "browser",
      "panels": [
        {
          "id": 1,
          "title": "Heap Usage",
          "type": "timeseries",
          "targets": [
            {
              "expr": "jvm_memory_used_bytes{area=\"heap\"} / jvm_memory_max_bytes{area=\"heap\"}",
              "legendFormat": "service"
            }
          ]
        },
        {
          "id": 2,
          "title": "CPU Usage",
          "type": "timeseries",
          "targets": [
            {
              "expr": "process_cpu_usage",
              "legendFormat": "service"
            }
          ]
        },
        {
          "id": 3,
          "title": "GC Pause Rate",
          "type": "timeseries",
          "targets": [
            {
              "expr": "rate(jvm_gc_pause_seconds_sum[5m])",
              "legendFormat": "service"
            }
          ]
        }
      ],
      "refresh": "10s"
    }

  business-metrics-dashboard.json: |
    {
      "id": null,
      "title": "My Bank App - Business Metrics",
      "tags": ["my-bank-app", "business"],
      "timezone": "browser",
      "panels": [
        {
          "id": 1,
          "title": "Failed Withdrawals",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(rate(failed_withdrawals_total[5m]))",
              "legendFormat": "withdrawals/sec"
            }
          ]
        },
        {
          "id": 2,
          "title": "Failed Transfers",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(rate(failed_transfers_total[5m]))",
              "legendFormat": "transfers/sec"
            }
          ]
        },
        {
          "id": 3,
          "title": "Notification Failures",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(rate(notification_failures_total[5m]))",
              "legendFormat": "notifications/sec"
            }
          ]
        },
        {
          "id": 4,
          "title": "Failed Withdrawals by Login",
          "type": "table",
          "targets": [
            {
              "expr": "sum by (login) (increase(failed_withdrawals_total[1h]))",
              "format": "table"
            }
          ]
        }
      ],
      "refresh": "10s"
    }
