replicaCount: 1

image:
  repository: my-bank-app-transfer-service
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  port: 8085

env:
  server_port: "8085"

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8085
  initialDelaySeconds: 120
  timeoutSeconds: 10
  periodSeconds: 30
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8085
  initialDelaySeconds: 120
  timeoutSeconds: 10
  periodSeconds: 30
  failureThreshold: 3