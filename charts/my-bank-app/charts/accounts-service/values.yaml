global:
  kafkaConfig:
    bootstrapServers: "my-bank-app-kafka:9092"
    logsTopic: "application.logs"
  zipkinConfig:
    endpoint: "http://my-bank-app-zipkin:9411/api/v2/spans"
  environment: "kubernetes"

replicaCount: 1

image:
  repository: my-bank-app-accounts-service
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8081

env:
  spring_datasource_url: "jdbc:postgresql://common-db:5432/common-db"
  server_port: "8081"
  keycloak_url: "http://keycloak:8080/realms/bank-app-realm"
  spring_datasource_username: "postgres"
  spring_datasource_password: "password"

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8081
  initialDelaySeconds: 90
  periodSeconds: 15
  timeoutSeconds: 10
  failureThreshold: 5

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8081
  initialDelaySeconds: 75
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 5

resources:
  limits:
    memory: "512Mi"
    cpu: "500m"
  requests:
    memory: "256Mi"
    cpu: "100m"