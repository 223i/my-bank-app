global:
  kafkaConfig:
    bootstrapServers: "my-bank-app-kafka:9092"
    logsTopic: "application.logs"
  zipkinConfig:
    endpoint: "http://my-bank-app-zipkin:9411/api/v2/spans"
  environment: "kubernetes"

replicaCount: 1

image:
  repository: my-bank-app-notifications-service
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  port: 8082

env:
  server_port: "8082"
  spring_datasource_url: "jdbc:postgresql://common-db:5432/common-db"
  spring_datasource_username: "postgres"
  spring_datasource_password: "password"

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8082
  initialDelaySeconds: 90
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 5

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8082
  initialDelaySeconds: 75
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 5