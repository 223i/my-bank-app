replicaCount: 1

image:
  repository: docker.elastic.co/kibana/kibana
  pullPolicy: IfNotPresent
  tag: "8.15.4"

service:
  type: ClusterIP
  port: 5601

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: kibana.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: false

nodeSelector: {}

tolerations: {}

affinity: {}

# Kibana configuration
kibana:
  # Server settings
  server:
    host: "0.0.0.0"
    port: 5601
  
  # Elasticsearch connection
  elasticsearch:
    hosts: ["http://my-bank-app-elasticsearch:9200"]
  
  # Security settings
  security:
    enabled: false
  
  # Index patterns
  index_patterns:
    - "my-bank-app-logs-*"
  
  # Storage configuration
  storage:
    enabled: true
    size: 1Gi
    class: ""