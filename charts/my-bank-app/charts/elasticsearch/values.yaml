replicaCount: 1

image:
  repository: docker.elastic.co/elasticsearch/elasticsearch
  pullPolicy: IfNotPresent
  tag: "8.15.4"

service:
  type: ClusterIP
  port: 9200

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: elasticsearch.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: false

serviceAccount:
  create: false
  name: ""

nodeSelector: {}

tolerations: {}

affinity: {}

# Elasticsearch configuration
elasticsearch:
  # Cluster settings
  cluster:
    name: "my-bank-app-logs"
    initial_master_nodes: "my-bank-app-elasticsearch-0"
  
  # JVM settings
  jvm:
    xms: "1g"
    xmx: "1g"
  
  # Discovery settings
  discovery:
    type: "single-node"
  
  # Network settings
  network:
    host: "0.0.0.0"
  
  # Security settings
  security:
    enabled: false  # Disable for simplicity in demo
  
  # Storage configuration
  storage:
    enabled: true
    size: 10Gi
    class: "" # Use default storage class
