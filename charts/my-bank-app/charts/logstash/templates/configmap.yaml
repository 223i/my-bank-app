apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "logstash.fullname" . }}
  labels:
    {{- include "logstash.labels" . | nindent 4 }}
data:
  logstash.conf: |
    input {
      tcp {
        port => {{ .Values.logstash.input.beats.port }}
        codec => json_lines
      }
    }

    filter {
      if ![timestamp] {
        mutate {
          add_field => { "timestamp" => "%{@timestamp}" }
        }
      }

      date {
        match => [ "timestamp", "ISO8601" ]
        target => "@timestamp"
      }

      if [service] {
        mutate {
          add_field => { "application" => "%{service}" }
        }
      }

      if [message] {
        mutate {
          gsub => [
            "message", "(?i)password[=:]\\s*\\S+", "password=*****",
            "message", "(?i)secret[=:]\\s*\\S+", "secret=*****",
            "message", "\\b\\d{16}\\b", "XXXXXXXXXXXXXXXX"
          ]
        }
      }
    }

    output {
      elasticsearch {
        hosts => {{ .Values.logstash.output.elasticsearch.hosts | toJson }}
        index => {{ .Values.logstash.output.elasticsearch.index | quote }}
      }
    }
