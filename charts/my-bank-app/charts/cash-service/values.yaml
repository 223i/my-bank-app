replicaCount: 1

image:
  repository: my-bank-app-cash-service
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  port: 8084

env:
  server_port: "8084"

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8084
  initialDelaySeconds: 120
  timeoutSeconds: 10
  periodSeconds: 30
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8084
  initialDelaySeconds: 120
  timeoutSeconds: 10
  periodSeconds: 30
  failureThreshold: 3