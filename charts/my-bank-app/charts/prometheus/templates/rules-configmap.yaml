apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "prometheus.fullname" . }}-rules
  labels:
    {{- include "prometheus.labels" . | nindent 4 }}
data:
  my-bank-app.yml: |
    groups:
      - name: my-bank-app.rules
        rules:
          # HTTP Metrics Alerts
          - alert: HighErrorRate
            expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) / rate(http_server_requests_seconds_count[5m]) > 0.05
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "High error rate detected"
              description: "HTTP 5xx rate exceeded the configured threshold"

          - alert: High4xxRate
            expr: rate(http_server_requests_seconds_count{status=~"4.."}[5m]) / rate(http_server_requests_seconds_count[5m]) > 0.1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High 4xx rate detected"
              description: "HTTP 4xx rate exceeded the configured threshold"

          - alert: HighResponseTime
            expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[5m])) > 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High response time detected"
              description: "HTTP p95 latency exceeded 1 second"

          # JVM Metrics Alerts
          - alert: HighMemoryUsage
            expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.8
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage detected"
              description: "Heap usage exceeded 80 percent"

          - alert: HighCPUUsage
            expr: rate(process_cpu_seconds_total[5m]) * 100 > 80
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage detected"
              description: "CPU usage exceeded the configured threshold"

          # Business Metrics Alerts
          - alert: FailedTransfersSpike
            expr: sum(rate(failed_transfers_total[5m])) > 0.1
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Spike in failed transfers detected"
              description: "Failed transfer rate exceeded the configured threshold"

          - alert: FailedWithdrawalsSpike
            expr: sum(rate(failed_cash_operations_total[5m])) > 0.1
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Spike in failed withdrawals detected"
              description: "Failed withdrawal rate exceeded the configured threshold"

          - alert: NotificationFailuresSpike
            expr: sum(rate(notification_failures_total[5m])) > 0.05
            for: 3m
            labels:
              severity: warning
            annotations:
              summary: "Spike in notification failures detected"
              description: "Notification failure rate exceeded the configured threshold"

          # Service Availability Alerts
          - alert: ServiceDown
            expr: up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Service is down"
              description: "One of the monitored services has been unavailable for more than 1 minute"
