apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "prometheus.fullname" . }}-rules
  labels:
    {{- include "prometheus.labels" . | nindent 4 }}
data:
  my-bank-app.yml: |
    groups:
      - name: my-bank-app.rules
        rules:
          # HTTP Metrics Alerts
          - alert: HighErrorRate
            expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) / rate(http_server_requests_seconds_count[5m]) > 0.05
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "High error rate detected"
              description: "Error rate is {{ $value | humanizePercentage }} for {{ $labels.service }}"

          - alert: High4xxRate
            expr: rate(http_server_requests_seconds_count{status=~"4.."}[5m]) / rate(http_server_requests_seconds_count[5m]) > 0.1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High 4xx rate detected"
              description: "4xx rate is {{ $value | humanizePercentage }} for {{ $labels.service }}"

          - alert: HighResponseTime
            expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[5m])) > 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High response time detected"
              description: "95th percentile response time is {{ $value }}s for {{ $labels.service }}"

          # JVM Metrics Alerts
          - alert: HighMemoryUsage
            expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.8
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage detected"
              description: "Heap memory usage is {{ $value | humanizePercentage }} for {{ $labels.service }}"

          - alert: HighCPUUsage
            expr: process_cpu_seconds_total * 100 > 80
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage detected"
              description: "CPU usage is {{ $value }}% for {{ $labels.service }}"

          # Business Metrics Alerts
          - alert: FailedTransfersSpike
            expr: rate(failed_transfers_total[5m]) > 0.1
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Spike in failed transfers detected"
              description: "Failed transfer rate is {{ $value }} transfers/second"

          - alert: FailedCashOperationsSpike
            expr: rate(failed_cash_operations_total[5m]) > 0.1
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Spike in failed cash operations detected"
              description: "Failed cash operation rate is {{ $value }} operations/second"

          - alert: NotificationFailuresSpike
            expr: rate(notification_failures_total[5m]) > 0.05
            for: 3m
            labels:
              severity: warning
            annotations:
              summary: "Spike in notification failures detected"
              description: "Notification failure rate is {{ $value }} failures/second"

          # Service Availability Alerts
          - alert: ServiceDown
            expr: up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Service is down"
              description: "{{ $labels.service }} has been down for more than 1 minute"

          # Kafka Alerts
          - alert: KafkaConsumerLag
            expr: kafka_consumer_lag_sum > 1000
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High Kafka consumer lag detected"
              description: "Consumer lag is {{ $value }} messages for {{ $labels.consumer }}"
