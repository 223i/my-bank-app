replicaCount: 1

image:
  repository: prom/prometheus
  pullPolicy: IfNotPresent
  tag: "v2.55.1"

service:
  type: ClusterIP
  port: 9090

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: prometheus.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: false

serviceAccount:
  create: false
  name: ""

nodeSelector: {}

tolerations: []

affinity: {}

config:
  global:
    scrape_interval: 15s
    evaluation_interval: 15s
  rule_files:
    - "/etc/prometheus/rules/*.yml"
  scrape_configs:
    - job_name: 'prometheus'
      static_configs:
        - targets: ['localhost:9090']
    - job_name: 'accounts-service'
      metrics_path: /actuator/prometheus
      static_configs:
        - targets: ['accounts-service:8081']
          labels:
            service: accounts-service
    - job_name: 'notifications-service'
      metrics_path: /actuator/prometheus
      static_configs:
        - targets: ['notifications-service:8082']
          labels:
            service: notifications-service
    - job_name: 'my-bank-front-app'
      metrics_path: /actuator/prometheus
      static_configs:
        - targets: ['my-bank-front-app:8083']
          labels:
            service: my-bank-front-app
    - job_name: 'cash-service'
      metrics_path: /actuator/prometheus
      static_configs:
        - targets: ['cash-service:8084']
          labels:
            service: cash-service
    - job_name: 'transfer-service'
      metrics_path: /actuator/prometheus
      static_configs:
        - targets: ['transfer-service:8085']
          labels:
            service: transfer-service
    - job_name: 'gateway-service'
      metrics_path: /actuator/prometheus
      static_configs:
        - targets: ['gateway-service:8000']
          labels:
            service: gateway-service

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

storage:
  enabled: false
  size: 10Gi
  class: ""
