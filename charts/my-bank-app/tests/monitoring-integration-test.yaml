apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "my-bank-app.fullname" . }}-monitoring-integration-test"
  labels:
    {{- include "my-bank-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "3"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: zipkin-prometheus-integration-test
      image: curlimages/curl:latest
      command:
        - /bin/sh
        - -c
        - |
          echo "Testing Zipkin integration..."
          
          # Test Zipkin API
          response=$(curl -s "http://{{ include "my-bank-app.fullname" . }}-zipkin.{{ .Release.Namespace }}.svc.cluster.local:9411/api/v2/services")
          if echo "$response" | grep -q "transfer-service\|cash-service\|notifications-service"; then
            echo "✅ Zipkin is collecting traces from microservices"
          else
            echo "ℹ️  Zipkin traces may not be available yet - this is normal for fresh deployments"
          fi
          
          # Test if services are registered in Zipkin
          response=$(curl -s "http://{{ include "my-bank-app.fullname" . }}-zipkin.{{ .Release.Namespace }}.svc.cluster.local:9411/api/v2/traces")
          if echo "$response" | grep -q "traceId\|id"; then
            echo "✅ Zipkin traces are available"
          else
            echo "ℹ️  Zipkin traces may not be generated yet - this is normal for fresh deployments"
          fi
    - name: logstash-elasticsearch-integration-test
      image: curlimages/curl:latest
      command:
        - /bin/sh
        - -c
        - |
          echo "Testing Logstash to Elasticsearch integration..."
          
          # Wait for potential logs to flow through
          sleep 45
          
          # Test if Logstash pipeline is running
          response=$(curl -s "http://{{ include "my-bank-app.fullname" . }}-logstash.{{ .Release.Namespace }}.svc.cluster.local:9600/_node/stats/pipeline?pretty")
          if echo "$response" | grep -q '"events"'; then
            echo "✅ Logstash pipeline is processing events"
          else
            echo "ℹ️  Logstash pipeline may not have processed events yet"
          fi
          
          # Test if Elasticsearch has received logs from Logstash
          response=$(curl -s "http://{{ include "my-bank-app.fullname" . }}-elasticsearch.{{ .Release.Namespace }}.svc.cluster.local:9200/_cat/indices/my-bank-app-logs-*?format=json")
          if echo "$response" | grep -q "my-bank-app-logs"; then
            echo "✅ Elasticsearch has received logs from Logstash"
          else
            echo "ℹ️  Elasticsearch may not have received logs yet - this is normal for fresh deployments"
          fi
    - name: prometheus-grafana-integration-test
      image: curlimages/curl:latest
      command:
        - /bin/sh
        - -c
        - |
          echo "Testing Prometheus to Grafana integration..."
          
          # Test if Grafana can query Prometheus
          response=$(curl -s -u admin:admin "http://{{ include "my-bank-app.fullname" . }}-grafana.{{ .Release.Namespace }}.svc.cluster.local:3000/api/datasources/proxy/1/api/v1/query?query=up")
          if echo "$response" | grep -q '"status":"success"'; then
            echo "✅ Grafana can successfully query Prometheus"
          else
            echo "❌ Grafana cannot query Prometheus"
            exit 1
          fi
          
          # Test if Grafana dashboards are using Prometheus data
          response=$(curl -s -u admin:admin "http://{{ include "my-bank-app.fullname" . }}-grafana.{{ .Release.Namespace }}.svc.cluster.local:3000/api/dashboards/name/my-bank-app-http-metrics")
          if echo "$response" | grep -q "dashboard" || echo "$response" | grep -q "not found"; then
            echo "✅ Grafana dashboards are configured"
          else
            echo "ℹ️  Grafana dashboards may still be loading"
          fi
    - name: end-to-end-monitoring-test
      image: curlimages/curl:latest
      command:
        - /bin/sh
        - -c
        - |
          echo "Running end-to-end monitoring test..."
          
          # Test overall monitoring stack health
          echo "Checking all monitoring components..."
          
          # Zipkin health
          if curl -f http://{{ include "my-bank-app.fullname" . }}-zipkin.{{ .Release.Namespace }}.svc.cluster.local:9411/health > /dev/null; then
            echo "✅ Zipkin: HEALTHY"
          else
            echo "❌ Zipkin: UNHEALTHY"
            exit 1
          fi
          
          # Prometheus health
          if curl -f http://{{ include "my-bank-app.fullname" . }}-prometheus.{{ .Release.Namespace }}.svc.cluster.local:9090/-/healthy > /dev/null; then
            echo "✅ Prometheus: HEALTHY"
          else
            echo "❌ Prometheus: UNHEALTHY"
            exit 1
          fi
          
          # Grafana health
          if curl -f http://{{ include "my-bank-app.fullname" . }}-grafana.{{ .Release.Namespace }}.svc.cluster.local:3000/api/health > /dev/null; then
            echo "✅ Grafana: HEALTHY"
          else
            echo "❌ Grafana: UNHEALTHY"
            exit 1
          fi
          
          # Elasticsearch health
          if curl -f http://{{ include "my-bank-app.fullname" . }}-elasticsearch.{{ .Release.Namespace }}.svc.cluster.local:9200/_cluster/health > /dev/null; then
            echo "✅ Elasticsearch: HEALTHY"
          else
            echo "❌ Elasticsearch: UNHEALTHY"
            exit 1
          fi
          
          # Logstash health
          if curl -f http://{{ include "my-bank-app.fullname" . }}-logstash.{{ .Release.Namespace }}.svc.cluster.local:9600/ > /dev/null; then
            echo "✅ Logstash: HEALTHY"
          else
            echo "❌ Logstash: UNHEALTHY"
            exit 1
          fi
          
          # Kibana health
          if curl -f http://{{ include "my-bank-app.fullname" . }}-kibana.{{ .Release.Namespace }}.svc.cluster.local:5601/api/status > /dev/null; then
            echo "✅ Kibana: HEALTHY"
          else
            echo "❌ Kibana: UNHEALTHY"
            exit 1
          fi
          
          echo "🎉 All monitoring components are healthy!"
          echo "📊 Monitoring stack is ready for use!"
