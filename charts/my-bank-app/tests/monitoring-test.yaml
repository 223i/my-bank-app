apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "my-bank-app.fullname" . }}-monitoring-test"
  labels:
    {{- include "my-bank-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: zipkin-test
      image: curlimages/curl:latest
      command:
        - /bin/sh
        - -c
        - |
          echo "Testing Zipkin..."
          curl -f http://{{ include "my-bank-app.fullname" . }}-zipkin.{{ .Release.Namespace }}.svc.cluster.local:9411/health || exit 1
          echo "✅ Zipkin is healthy"
    - name: prometheus-test
      image: curlimages/curl:latest
      command:
        - /bin/sh
        - -c
        - |
          echo "Testing Prometheus..."
          curl -f http://{{ include "my-bank-app.fullname" . }}-prometheus.{{ .Release.Namespace }}.svc.cluster.local:9090/-/healthy || exit 1
          echo "✅ Prometheus is healthy"
    - name: grafana-test
      image: curlimages/curl:latest
      command:
        - /bin/sh
        - -c
        - |
          echo "Testing Grafana..."
          curl -f http://{{ include "my-bank-app.fullname" . }}-grafana.{{ .Release.Namespace }}.svc.cluster.local:3000/api/health || exit 1
          echo "✅ Grafana is healthy"
    - name: elasticsearch-test
      image: curlimages/curl:latest
      command:
        - /bin/sh
        - -c
        - |
          echo "Testing Elasticsearch..."
          curl -f http://{{ include "my-bank-app.fullname" . }}-elasticsearch.{{ .Release.Namespace }}.svc.cluster.local:9200/_cluster/health || exit 1
          echo "✅ Elasticsearch is healthy"
    - name: logstash-test
      image: curlimages/curl:latest
      command:
        - /bin/sh
        - -c
        - |
          echo "Testing Logstash..."
          curl -f http://{{ include "my-bank-app.fullname" . }}-logstash.{{ .Release.Namespace }}.svc.cluster.local:9600/ || exit 1
          echo "✅ Logstash is healthy"
    - name: kibana-test
      image: curlimages/curl:latest
      command:
        - /bin/sh
        - -c
        - |
          echo "Testing Kibana..."
          curl -f http://{{ include "my-bank-app.fullname" . }}-kibana.{{ .Release.Namespace }}.svc.cluster.local:5601/api/status || exit 1
          echo "✅ Kibana is healthy"
